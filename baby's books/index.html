<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby's Books</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Fredoka One', cursive;
  background: linear-gradient(135deg, #ffecd2, #fcb69f, #a8edea, #fed6e3);
  background-size: 400% 400%;
  animation: gradient 8s ease infinite;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
h1 {
  font-size: clamp(2rem, 6vw, 4rem);
  color: #fff;
  text-shadow: 4px 4px 0 #e07c7c, 7px 7px 0 rgba(0,0,0,0.1);
  margin-bottom: 40px;
  animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.books {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  justify-content: center;
  max-width: 800px;
}
.book-card {
  background: #fff;
  border-radius: 30px;
  padding: 30px;
  width: 280px;
  text-align: center;
  text-decoration: none;
  color: #333;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
  border: 4px solid transparent;
}
.book-card:hover {
  transform: translateY(-8px) rotate(-2deg);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}
.book-card:nth-child(1) { border-color: #FF9FF3; }
.book-card:nth-child(2) { border-color: #FECA57; }
.book-icon { font-size: 4rem; margin-bottom: 15px; }
.book-title { font-size: 1.5rem; color: #555; }
.book-card:nth-child(1) .book-title { color: #e07c7c; }
.book-card:nth-child(2) .book-title { color: #e0a07c; }
.back {
  margin-top: 50px;
  color: #fff;
  text-decoration: none;
  font-size: 1.2rem;
  background: rgba(255,255,255,0.2);
  padding: 12px 30px;
  border-radius: 50px;
  backdrop-filter: blur(5px);
  transition: background 0.3s;
}
.back:hover { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <h1>📚 Baby's Books</h1>
  <div class="books">
    <a href="Mochi-Colors-and-Shapes.html" class="book-card">
      <div class="book-icon">🎨</div>
      <div class="book-title">Colors & Shapes</div>
    </a>
    <a href="../numbers.html" class="book-card">
      <div class="book-icon">🔢</div>
      <div class="book-title">Numbers 1–100</div>
    </a>
  </div>
  <a href="../index.html" class="back">← Home</a>
</body>
</html>
